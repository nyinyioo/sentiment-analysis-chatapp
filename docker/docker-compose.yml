version: '3.8'
services:
  mongodb:
    image: mongo
    container_name: mongodb
    # credentials come from the project root .env — never hardcoded here
    # env_file passes MONGO_INITDB_ROOT_USERNAME + MONGO_INITDB_ROOT_PASSWORD
    # directly to the container (MongoDB reads these natively)
    env_file:
      - ../.env
    ports:
      - "27017:27017"
    volumes:
      - ./initdb.mongo:/docker-entrypoint-initdb.d/initdb.mongo
      - ./initUsers.mongo:/docker-entrypoint-initdb.d/initUsers.mongo
    networks:
      - app_network

networks:
  app_network:
    driver: bridge
