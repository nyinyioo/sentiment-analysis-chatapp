<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Room</title>
    <link rel="stylesheet" href="/login_assets/chatroom_styles.css"> 
</head>
<body>
    <div class="chat-container">
        <h1>Welcome to <%= room.name %></h1>
        <div id="message-list" class="message-list"></div>
        <textarea id="message-input" placeholder="Type your message..."></textarea>
        <button id="send-message">Send</button>
    </div>

        <footer>
        <div class="footer-bottom">
            &copy; 2024 NYI 
        </div>
    </footer>
    <!-- <script src="/js/script.js"></script> -->
    <!-- <script nonce="<%= nonce %>" src="/js/script.js"></script> -->
    <script nonce="<%= nonce %>" src="/client/login_assets/script.js"></script>
    <script nonce="<%= nonce %>">
        const roomId = "<%= room._id %>";
        const socket = new WebSocket("ws://localhost:8000");

        socket.onopen = () => {
            console.log("Connected to the chatroom:", roomId);
        };

        socket.onmessage = (event) => {
            console.log("Message received:", event.data); // Debug log
            const message = JSON.parse(event.data);
            const messageList = document.getElementById("message-list");
            const messageElem = document.createElement("div");
            messageElem.textContent = `${message.username}: ${message.text}`;
            messageList.appendChild(messageElem);
        };

        document.getElementById("send-message").addEventListener("click", () => {
        const input = document.getElementById("message-input");
        const text = input.value;
        if (text) {
            console.log("Sending message:", text); // Debug log
            socket.send(JSON.stringify({ roomId, text }));
            input.value = "";
        }
    });       
    </script>
</body>
</html>
